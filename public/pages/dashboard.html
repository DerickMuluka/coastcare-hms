<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — CoastCare</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body class="app-body">
<header class="navbar" id="navbar">
  <a href="/pages/dashboard.html" class="brand"><span class="brand-mark">C</span><span class="brand-text">CoastCare<span class="dot">.</span></span></a>
  <nav class="nav-links" id="appNav">
    <a href="/pages/dashboard.html" class="active">Dashboard</a>
    <a href="/pages/appointments.html">Appointments</a>
    <a href="/pages/doctors.html">Doctors</a>
    <a href="/pages/patients.html" data-role="staff">Patients</a>
    <a href="/pages/prescriptions.html">Records</a>
    <a href="/pages/lab.html">Lab</a>
    <a href="/pages/billing.html">Billing</a>
    <a href="/pages/users.html" data-role="admin">Users <span id="pendingBadge" class="pending-badge" style="display:none">0</span></a>
    <a href="/pages/activity.html" data-role="admin">Activity</a>
    <a href="/pages/profile.html">My Profile</a>
  </nav>
  <div class="nav-actions">
    <span class="user-chip" id="userChip">…</span>
    <button class="btn btn-ghost btn-sm" onclick="HMS.logout()">Logout</button>
  </div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<main class="app-main">
  <div class="page-header">
    <div>
      <h1 id="welcomeTitle">Dashboard</h1>
      <p class="page-sub" id="welcomeSub">Loading…</p>
    </div>
  </div>

  <div id="pendingAlert" class="pending-alert" style="display:none">
    <div>
      <strong id="pendingAlertCount">0</strong> user(s) are awaiting approval.
    </div>
    <a href="/pages/users.html#pending" class="btn btn-primary btn-sm">Review Now</a>
  </div>

  <div id="statsGrid" class="grid grid-4 stats-grid"></div>
  <div id="contentArea" class="content-area"></div>
</main>

<style>
.pending-badge {
  display: inline-block;
  background: var(--coral-dark);
  color: #fff;
  border-radius: 999px;
  padding: 0 .45rem;
  font-size: .7rem;
  font-weight: 800;
  margin-left: .25rem;
  min-width: 18px;
  text-align: center;
}
.pending-alert {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  background: rgba(255,184,0,0.15);
  border: 1px solid rgba(255,184,0,0.45);
  color: #92600a;
  padding: 1rem 1.25rem;
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  font-weight: 600;
  flex-wrap: wrap;
}
</style>

<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
