<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — CoastCare</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
<link rel="stylesheet" href="/css/profile.css" />
</head>
<body class="app-body">
<header class="navbar" id="navbar">
  <a href="/pages/dashboard.html" class="brand"><span class="brand-mark">C</span><span class="brand-text">CoastCare<span class="dot">.</span></span></a>
  <nav class="nav-links">
    <a href="/pages/dashboard.html">Dashboard</a>
    <a href="/pages/appointments.html">Appointments</a>
    <a href="/pages/doctors.html">Doctors</a>
    <a href="/pages/prescriptions.html">Records</a>
    <a href="/pages/lab.html">Lab</a>
    <a href="/pages/billing.html">Billing</a>
    <a href="/pages/profile.html" class="active">My Profile</a>
  </nav>
  <div class="nav-actions">
    <span class="user-chip" id="userChip">…</span>
    <button class="btn btn-ghost btn-sm" onclick="HMS.logout()">Logout</button>
  </div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<main class="app-main">
  <div class="page-header">
    <div><h1>My Profile</h1><p class="page-sub">Manage your account details, photo and password.</p></div>
  </div>

  <div class="profile-layout">
    <aside class="profile-side">
      <div class="avatar-block">
        <div class="avatar-display" id="avatarDisplay">…</div>
        <input type="file" id="photoInput" accept="image/*" hidden />
        <button class="btn btn-outline btn-sm" id="changePhotoBtn">Change Photo</button>
        <p class="hint">JPG, PNG or WEBP · Max 3MB</p>
      </div>
      <div class="id-badge">
        <span class="id-label" id="idLabel">ID</span>
        <span class="id-value" id="idValue">—</span>
      </div>
      <div class="role-badge" id="roleBadge">—</div>
      <div class="meta-info">
        <div><strong>Member since</strong><span id="joinedAt">—</span></div>
        <div><strong>Last login</strong><span id="lastLogin">—</span></div>
      </div>
    </aside>

    <div class="profile-main">
      <section class="panel">
        <h2>Personal Information</h2>
        <form id="profileForm">
          <div class="grid-2">
            <div class="field"><label>Full Name</label><input id="pFullName" /></div>
            <div class="field"><label>Phone</label><input id="pPhone" /></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Date of Birth</label><input type="date" id="pDob" /></div>
            <div class="field"><label>Gender</label>
              <select id="pGender"><option value="">Select</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
            </div>
          </div>
          <div class="field"><label>Address</label><input id="pAddress" placeholder="Street, Mombasa" /></div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </section>

      <section class="panel">
        <h2>Change Email</h2>
        <form id="emailForm">
          <div class="field"><label>New Email</label><input type="email" id="newEmail" required /></div>
          <div class="field">
            <label>Current Password</label>
            <div class="password-wrap">
              <input type="password" id="emailPwd" required />
              <button type="button" class="password-toggle" data-target="emailPwd">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Update Email</button>
        </form>
      </section>

      <section class="panel">
        <h2>Change Password</h2>
        <form id="pwdForm">
          <div class="field">
            <label>Current Password</label>
            <div class="password-wrap">
              <input type="password" id="curPwd" required />
              <button type="button" class="password-toggle" data-target="curPwd">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label>New Password</label>
            <div class="password-wrap">
              <input type="password" id="newPwd" required minlength="8" placeholder="8+ chars, 1 uppercase, 1 number" />
              <button type="button" class="password-toggle" data-target="newPwd">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
      </section>

      <section class="panel">
        <h2>Recent Activity</h2>
        <table class="table" id="activityTable">
          <thead><tr><th>Action</th><th>Description</th><th>IP</th><th>When</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
