<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Appointments — CoastCare</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
<link rel="stylesheet" href="/css/appointments.css" />
</head>
<body class="app-body">
<header class="navbar" id="navbar">
  <a href="/pages/dashboard.html" class="brand"><span class="brand-mark">C</span><span class="brand-text">CoastCare<span class="dot">.</span></span></a>
  <nav class="nav-links">
    <a href="/pages/dashboard.html">Dashboard</a>
    <a href="/pages/appointments.html" class="active">Appointments</a>
    <a href="/pages/doctors.html">Doctors</a>
    <a href="/pages/prescriptions.html">Records</a>
    <a href="/pages/lab.html">Lab</a>
    <a href="/pages/billing.html">Billing</a>
  </nav>
  <div class="nav-actions"><span class="user-chip" id="userChip">…</span><button class="btn btn-ghost btn-sm" onclick="HMS.logout()">Logout</button></div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<main class="app-main">
  <div class="page-header">
    <div><h1>Appointments</h1><p class="page-sub">Book, confirm, complete or cancel visits.</p></div>
    <button class="btn btn-primary" id="openBooking">+ New Appointment</button>
  </div>

  <div class="panel" id="bookingPanel" hidden>
    <h2>Book Appointment</h2>
    <div class="grid-3">
      <div class="field" id="patientPickerField" style="display:none">
        <label>Patient</label><select id="patientSelect"></select>
      </div>
      <div class="field"><label>Department</label><select id="deptSelect"><option value="">All departments</option></select></div>
      <div class="field"><label>Doctor</label><select id="docSelect"><option value="">Select doctor</option></select></div>
      <div class="field"><label>Date</label><input type="date" id="dateInput" /></div>
    </div>
    <div class="field">
      <label>Available Slots</label>
      <div id="slots" class="slot-grid"><span class="empty">Select doctor and date</span></div>
    </div>
    <div class="field"><label>Reason (optional)</label><textarea id="reasonInput" rows="2"></textarea></div>
    <div class="row-actions">
      <button class="btn btn-primary" id="confirmBook">Confirm Booking</button>
      <button class="btn btn-ghost" id="cancelBook">Cancel</button>
    </div>
  </div>

  <div class="panel">
    <div class="row-actions" style="margin-bottom:1rem">
      <select id="statusFilter" style="max-width:200px">
        <option value="">All statuses</option>
        <option>pending</option><option>confirmed</option>
        <option>completed</option><option>cancelled</option><option>no_show</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table class="table" id="apptTable">
        <thead><tr><th>Ref</th><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/appointments.js"></script>
</body>
</html>
