<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — CoastCare</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-body">
<a href="/" class="auth-brand">
  <span class="brand-mark">C</span>
  <span class="brand-text">CoastCare<span class="dot">.</span></span>
</a>
<div class="auth-shell">
  <aside class="auth-side">
    <h2>Join CoastCare.</h2>
    <p>Register as a patient and receive your unique Patient Number instantly.</p>
    <ul class="auth-points">
      <li><span>✓</span> Instant appointment booking</li>
      <li><span>✓</span> Unique Patient ID</li>
      <li><span>✓</span> Digital record access</li>
    </ul>
    <div class="auth-side-deco"></div>
  </aside>
  <form class="auth-form" id="registerForm" novalidate>
    <h1>Create Account</h1>
    <p class="auth-sub">Fill in your details below</p>

    <div class="field">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" required placeholder="e.g. Juma Hassan" />
    </div>

    <div class="grid grid-2" style="gap:0">
      <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required placeholder="you@example.com" /></div>
      <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" required placeholder="+2547..." /></div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" required minlength="8" placeholder="8+ chars, 1 uppercase, 1 number" />
        <button type="button" class="password-toggle" data-target="password">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>
        </button>
      </div>
    </div>

    <div class="grid grid-2" style="gap:0">
      <div class="field"><label for="dob">Date of Birth</label><input type="date" id="dob" name="dob" required /></div>
      <div class="field"><label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <div class="grid grid-2" style="gap:0">
      <div class="field"><label for="blood_group">Blood Group</label>
        <select id="blood_group" name="blood_group">
          <option value="">Select</option>
          <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
        </select>
      </div>
      <div class="field"><label for="emergency_contact">Emergency Contact</label><input type="tel" id="emergency_contact" name="emergency_contact" placeholder="+2547..." /></div>
    </div>

    <div class="field"><label for="address">Address</label><input type="text" id="address" name="address" placeholder="Street, Mombasa" /></div>

    <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="margin-top:.75rem">Create Account</button>
    <p class="auth-switch">Already registered? <a href="/pages/login.html">Sign in</a></p>
  </form>
</div>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
