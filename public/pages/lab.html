<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lab — CoastCare</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body class="app-body">
<header class="navbar" id="navbar">
  <a href="/pages/dashboard.html" class="brand"><span class="brand-mark">C</span><span class="brand-text">CoastCare<span class="dot">.</span></span></a>
  <nav class="nav-links">
    <a href="/pages/dashboard.html">Dashboard</a>
    <a href="/pages/appointments.html">Appointments</a>
    <a href="/pages/prescriptions.html">Records</a>
    <a href="/pages/lab.html" class="active">Lab</a>
    <a href="/pages/billing.html">Billing</a>
  </nav>
  <div class="nav-actions"><span class="user-chip" id="userChip">…</span><button class="btn btn-ghost btn-sm" onclick="HMS.logout()">Logout</button></div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<main class="app-main">
  <div class="page-header"><div><h1>Laboratory</h1><p class="page-sub">Test requests and results.</p></div></div>

  <div class="panel" id="labActions" hidden>
    <h2>Request Lab Test</h2>
    <div class="grid grid-3">
      <div class="field"><label>Patient</label><select id="labPatient"></select></div>
      <div class="field"><label>Test Name</label><input id="labTest" placeholder="e.g. MRI Brain" /></div>
      <div class="field" style="display:flex;align-items:flex-end"><button class="btn btn-primary" id="requestLab">Submit</button></div>
    </div>
  </div>

  <div class="panel">
    <h2>All Lab Tests</h2>
    <div style="overflow-x:auto">
      <table class="table" id="labTable">
        <thead><tr><th>Patient</th><th>Test</th><th>Doctor</th><th>Status</th><th>Result</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/lab.js"></script>
</body>
</html>
