<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activity — CoastCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body class="app-body">
<header class="navbar" id="navbar">
  <a href="/pages/dashboard.html" class="brand"><span class="brand-mark">C</span><span class="brand-text">CoastCare<span class="dot">.</span></span></a>
  <nav class="nav-links">
    <a href="/pages/dashboard.html">Dashboard</a>
    <a href="/pages/users.html">Users</a>
    <a href="/pages/activity.html" class="active">Activity</a>
    <a href="/pages/departments.html">Departments</a>
  </nav>
  <div class="nav-actions"><span class="user-chip" id="userChip">…</span><button class="btn btn-ghost btn-sm" onclick="HMS.logout()">Logout</button></div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>
<main class="app-main">
  <div class="page-header"><div><h1>System Activity Log</h1><p class="page-sub">Every action taken across the system.</p></div></div>
  <div class="panel">
    <div style="overflow-x:auto">
      <table class="table" id="logTable">
        <thead><tr><th>When</th><th>User</th><th>Role</th><th>Action</th><th>Description</th><th>IP</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>
<script src="/js/common.js"></script>
<script>
(async () => {
  const u = await HMS.requireUser();
  if (!u || u.role !== 'admin') { location.href = '/pages/dashboard.html'; return; }
  document.getElementById('userChip').textContent = `${u.full_name} · admin`;
  const tb = document.querySelector('#logTable tbody');
  try {
    const rows = await HMS.api('/activity');
    tb.innerHTML = rows.length ? rows.map(r => `<tr>
      <td>${new Date(r.created_at).toLocaleString()}</td>
      <td>${r.full_name || '—'}</td>
      <td>${r.role || '—'}</td>
      <td><code>${r.action}</code></td>
      <td>${r.description||'—'}</td>
      <td>${r.ip_address||'—'}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">No activity</td></tr>';
  } catch (e) { tb.innerHTML = `<tr><td colspan="6" class="empty">${e.message}</td></tr>`; }
})();
</script>
</body>
</html>
