<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — CoastCare</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-body">
<a href="/" class="auth-brand">
  <span class="brand-mark">C</span>
  <span class="brand-text">CoastCare<span class="dot">.</span></span>
</a>
<div class="auth-shell">
  <aside class="auth-side">
    <h2>Welcome back.</h2>
    <p>Sign in to manage appointments, view records and pay bills.</p>
    <ul class="auth-points">
      <li><span>✓</span> Live appointment status</li>
      <li><span>✓</span> Digital prescriptions</li>
      <li><span>✓</span> Secure billing history</li>
    </ul>
    <div class="auth-side-deco"></div>
  </aside>
  <form class="auth-form" id="loginForm" novalidate>
    <h1>Sign In</h1>
    <p class="auth-sub">Enter your credentials</p>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required placeholder="you@coastcare.co.ke" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="password-toggle" data-target="password">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
    <p class="auth-switch">New patient? <a href="/pages/register.html">Create an account</a></p>
  </form>
</div>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
